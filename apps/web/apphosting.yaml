# Firebase App Hosting: configuración base (production).
# Los overrides de staging están en apphosting.staging.yaml.
# La configuración web de Firebase la inyecta App Hosting (no hace falta NEXT_PUBLIC_FIREBASE_*).
# Documentación: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 1
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_BRAND_NAME
    value: StoryNido
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_BRAND_DOMAIN
    value: storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_ENV
    value: production
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ADMIN_URL
    value: https://admin.storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_API_URL
    value: https://api.storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: 'false'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: '1'
    availability: [BUILD]
