# Firebase App Hosting: configuración base (production).
# Los overrides de staging están en apphosting.staging.yaml.
# La configuración web de Firebase la inyecta App Hosting (no hace falta NEXT_PUBLIC_FIREBASE_*).
# Documentación: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_BRAND_NAME
    value: StoryNido
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_BRAND_DOMAIN
    value: storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_ENV
    value: production
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ADMIN_URL
    value: https://admin.storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_API_URL
    value: https://api.storynido.com
    availability: [BUILD, RUNTIME]
  # Dominio propio para el login con Google/Apple: con el de firebaseapp.com, Chrome y Safari del
  # celular bloquean el almacenamiento entre dominios y la redirección no vuelve con la sesión.
  # /__/auth/* se reenvía al handler de Firebase (ver next.config.ts).
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: storynido.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: 'false'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: '1'
    availability: [BUILD]
  # PayPal live: client id público (como en staging).
  - variable: NEXT_PUBLIC_PAYPAL_CLIENT_ID
    value: BAAhar0S7vHJKW6VT9u2Ix48R9ZG7kvcKV0ZT9TeMkZzPCcoZy4ijmkRnCGnym8vFpjT0GEBsQoaaP8fUQ
    availability: [BUILD, RUNTIME]
  # Google Analytics 4 (propiedad StoryNido). Solo carga con consentimiento de analítica.
  - variable: NEXT_PUBLIC_GA4_MEASUREMENT_ID
    value: G-RYV5RCRTFC
    availability: [BUILD, RUNTIME]
  # Redes del pie (una red sin URL no aparece).
  - variable: NEXT_PUBLIC_SOCIAL_INSTAGRAM
    value: https://www.instagram.com/storynido.redes/
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SOCIAL_TIKTOK
    value: https://www.tiktok.com/@storynido.redes
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SOCIAL_PINTEREST
    value: https://www.pinterest.com/storynido/
    availability: [BUILD, RUNTIME]
