name: E2E

# Fase 17 (DECISIONS 090):
# - en cada PR y en main: el recorrido completo contra los emuladores de Firebase, con la API,
#   el worker, la web y el admin locales y todos los proveedores simulados (sin costo);
# - después de cada deploy de staging: las páginas públicas contra staging (sin escribir datos).

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Deploy]
    types: [completed]

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  local:
    name: E2E con emuladores
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:8080
      APP_ENV: local
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storynido/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @storynido/web --filter @storynido/admin build
      # Los emuladores con los puertos de desarrollo (firebase.json); el seed carga el catálogo y
      # Playwright levanta la API, el worker, la web y el admin.
      - run: >-
          ./firebase/scripts/firebase.sh emulators:exec --only auth,firestore,storage
          --project demo-storynido
          "pnpm --filter @storynido/firebase exec tsx src/seed.ts && E2E_START=1 pnpm --filter @storynido/e2e e2e"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  staging:
    name: E2E de humo contra staging
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storynido/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @storynido/e2e e2e tests/landings.spec.ts
        env:
          E2E_BASE_URL: https://web--storynido-staging.us-central1.hosted.app
