packages:
  - apps/*
  - services/*
  - packages/*
  - firebase
  - e2e
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  protobufjs: false
  re2: false
  unrs-resolver: true
# Seguridad (fase 16): versiones transitivas con vulnerabilidades altas (pnpm audit en CI).
overrides:
  '@grpc/grpc-js@<1.13.6': 1.13.7
